<DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style4.css">
    <title>My Gallery</title>
</head>
 <div class="wrapper">
<body>
    <h1>My Gallery.</h1>
    <p>Welcome to my Gallery, view my artworks here. </p>
    <div class="grid-container">
        <div class="box" style="grid-area: box-1">
            <img height="100%" width="100%" src="Anya.jpg" alt="Anya">
        </div> 
        <div class="box" style="grid-area: box-2">
            <img height="100%" width="100%" src="Clock.jpg" alt="Clock">
        </div>
        <div class="box" style="grid-area: box-3">
            <img height="100%" width="100%" src="Donut.jpg" alt="Donut">
        </div>
        <div class="box" style="grid-area: box-4">
            <img height="100%" width="100%" src="DucksInAPond.jpg" alt="Ducks in a Pond">
        </div>
        <div class="box" style="grid-area: box-5">
            <img height="100%" width="100%" src="Flower.jpg" alt="Flower">
        </div>
        <div class="box" style="grid-area: box-6">
            <img height="100%" width="100%" src="Foxy.jpg" alt="Foxy">
        </div>
        <div class="box" style="grid-area: box-7">
            <img height="100%" width="100%" src="Giraffey.jpg" alt="Giraffey">
        </div>
        <div class="box" style="grid-area: box-8">
            <img height="100%" width="100%" src="LakeGirl.jpg" alt="LakeGirl">
        </div>
        <div class="box" style="grid-area: box-9">
            <img height="100%" width="100%" src="Mew.jpg" alt="Mew">
        </div>
        <div class="box" style="grid-area: box-10">
            <img height="100%" width="100%" src="TeddyBear.jpg" alt="Teddy Bear">
        </div>
    </div>
</body>
</html>
