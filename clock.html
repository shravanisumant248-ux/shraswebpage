<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clocky</title>
    <link rel="stylesheet" href="clock.css">
    <style type="text/css">
        nav{
            background-color: var(--primary-color);
            border-bottom: 1px solid var(--hover-color);
        }
        nav ul{
            list-style: none;
            display:flex;
        }
        nav .home-li{
            margin-right:auto;
        }
        nav a{
            display: flex;
            text-decoration:none;
            color:var(--text-color);
            padding:1em 2em;
            transition: background-color 150ms ease;
        }
        nav a:hover{
            background-color: var(--hover-color);
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li class="home-li"><a href="index.html">Login</a></li>
            <li><a href="Art.html">Home</a></li>
            <li><a href="Books.html">Books</a></li>
            <li><a href="clock.html">Clock</a></li>
            <li><a href="Japanese.html">Blueyfy</a></li>
        </ul>
    </nav>
    <div id="clock-container">
        <div id="clock">00:00:00</div>
    </div>
    <div id="country">
        <div class="Australia">Australia</div>
        <div class="India">India</div>
        <div class="America">America</div>
        <div class="Japan">Japan</div>
        <div class="England">England</div>
        <div class="Bangladesh">Bangladesh</div>
        <div class="New_Zealand">New Zealand</div>
        <div class="Russia">Russia</div>
    </div>
    <script src="clock.js"></script>
</body>
</html>
